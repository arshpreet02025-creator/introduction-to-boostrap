<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My hobby card</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        body{
            background-color: lightpink;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }
        h1{
            text-align: center;
            color: aquamarine;
        }
        .hobby{
            text-align: center;
            border: 2px solid palevioletred;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: lightyellow;
        }
        .hobby h3{
            color: rgb(104, 144, 212);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby">
                    <h3>Arts and crafts</h3>
                    <p>I like doing arts and crafts because the are fun to do and I find really cool thing to make.</p>
                </div>
            </div> 
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby">
                    <h3>Baking</h3>
                    <p>I like making different thing and trying them with my family.</p>
                </div>
            </div>
             <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby">
                    <h3>Netball</h3>
                    <p>I love playing netball it is a really fun game.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
</body>
</html>
